[package]
name = "ihrz"
version = "2026.10.1"
edition = "2021"
description = "iHorizon Discord Bot - Rust port (serenity + poise)"
license = "CC-BY-NC-SA-4.0"

[[bin]]
name = "ihrz"
path = "src/main.rs"

[dependencies]
poise = { version = "0.6", features = ["cache"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "framework", "standard_framework", "gateway", "http", "utils", "collector"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
once_cell = "1.19"
sqlx = { version = "0.7", features = ["sqlite", "postgres", "runtime-tokio", "macros"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
chrono = "0.4"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
png = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
toml = "1.1.8"
