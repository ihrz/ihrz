# iHorizon Rust bot configuration — example file.
# Mirrors src/files/config.example.ts (section layout + comments).
# Copy to `config.toml` (next to this file, or repo-root `rust/config.toml`):
#   cp config.example.toml config.toml
# Load order: built-in defaults < config.toml < environment variables.
# Tokens: env wins (BOT_TOKEN, HORIZON_API_TOKEN); the `token` / `api_token`
# file keys below are the fallback (mirrors TS `process.env.X || config...`).
# Never commit a real token — `config.toml` stays local (gitignored).

[discord]
# token: Discord bot token (TS config.discord.token). Env BOT_TOKEN wins.
# token = "paste-bot-token-here"
phone_presence = false
message_commands_mention = true
default_prefix = "?"

[core]
dev_mode = true
blacklist_picture = "https://ihorizon.org/assets/img/bot/bsod.png"
guild_logs_channel_id = ""
report_channel_id = "1509600857828626482"
# The Discord channel ID for logs when lavalink throws an error
# (trackError full report + owner ping). Empty = no error-channel post.
lavalink_logs_channel_id = ""

[command]
# Love command: couples that always show 100%. Format "USER_ID_ONExUSER_ID_TWO".
always100 = []

[owners]
# Extra owners (same powers as config.owners.users in TS):
# /eval everywhere, cannot be unownered/blacklisted/banned from the DB.
users = []

[lavalink]
# Mirrors config.lavalink.nodes in src/files/config.ts. Empty = audio
# commands run against local player state only (offline mock path).
#
# Server-side sources (Spotify / Apple Music / Deezer / Tidal / YouTube)
# are resolved by plugins installed ON THE NODE, not in this bot — plain
# track URLs pass through and only bare text gets the `ytsearch:` prefix
# (mirrors defaultSearchPlatform: "youtube"). Node application.yml needs:
#   lavalink:
#     plugins:
#       - "com.github.topi314.lavasrc:lavasrc-plugin:<version>"
#       - "com.github.topi314.lavayoutube:youtube-plugin:<version>"
#   plugins:
#     lavasrc:
#       providers: [spotify, applemusic, deezer, tidal, youtube]
# (credentials per provider live in the node config, never here.)
#
# TS reference nodes (fill in real secrets, never commit them):
# [[lavalink.nodes]]
# id = "node0"
# host = "lava-v4.ajieblogs.eu.org"
# port = 443
# authorization = "https://dsc.gg/ajidevserver"
# secure = true
# [[lavalink.nodes]]
# id = "node1"
# host = "192.168.1.193"
# port = 2333
# authorization = "X4yI618A6jz!Ij0@Hq(={"
# secure = false
[[lavalink.nodes]]
id = "example_node"
host = "lavalink.example.com"
port = 2333
authorization = "password"
secure = false

[api]
horizon_gateway_local = "http://127.0.0.1:31981"
# Public gateway (TS config.api.HorizonGateway): html2png, monitoring,
# authrestore OAuth links, userinfo/vanity, webhooks. Env HORIZON_GATEWAY
# wins over this value.
horizon_gateway = "http://127.0.0.1:31981"
client_id = ""
# api_token: HorizonGateway token (TS config.api.apiToken). Env wins.
# api_token = "paste-api-token-here"

[console]
# Mirrors config.console.emojis (cosmetic startup glyphs, TS console only).
ok = "✅"
error = "❌"
host = "💻"
kisa = "👩"
load = "🔄"

[database]
# sqlite is the only offline-capable backend (others need servers;
# see U-DB-DRIVERS). `url` shares src/files/db.sqlite with the TS bot.
method = "sqlite"
url = "sqlite:./src/files/db.sqlite?mode=rwc"
# Optional second database (TS `database.mySQL[1]`, `client.db2` side).
# Empty = no secondary. Real secret via DATABASE_URL_SECONDARY env.
secondary_url = ""
# TS `database.mySQL[]` parts. [0] = primary postgres, [1] = secondary.
# Full URL strings (url / DATABASE_URL) win over parts. Passwords prefer
# env in real deployments — never commit real secrets to a tracked file.
# [[database.mysql]]
# host = "localhost"
# port = 5432
# database = "mydb"
# user = "myuser"
# password = "changeme"
# TS `database.horizon_db` parts. When set, the horizondb endpoint is
# composed as ws://host:port (login/password auth); otherwise `url`
# above is recorded verbatim.
# [database.horizon_db]
# host = "127.0.0.1"
# port = 8080
# login = "admin"
# password = "changeme"

[lastfm]
# Optional; required only for the Last.fm scrobbler module.
# Prefer LASTFM_API_KEY / LASTFM_SHARED_SECRET env vars for real secrets.
api_key = ""
shared_secret = ""
