# fr-FR.yml (French - France)
new_guild_embed_title:
    - "Bienvenue sur votre serveur ! 🎉"
    - "Salutations, chers amis Discord ! 👋"
    - "iHorizon a rejoint le chat ! 💬"
    - "C'est un oiseau, c'est un avion, non, c'est iHorizon ! 🦸‍♂"
    - "Souhaitons la bienvenue à iHorizon ! 🔥"
    - "Une nouvelle aventure commence ! 🚀"
    - "Un membre fantastique nous a rejoints ! ✨"
new_guild_embed_desc: "## ${randomMessage}\nSalut les amis extraordinaires !\n\nJe suis iHorizon, un bot avancé conçu pour rendre votre expérience Discord exceptionnelle et pleine de fun.\n\n✨ **Ce que je peux faire pour vous :**\n• Gestion du serveur avec intelligence et professionnalisme\n• Jeux interactifs et divertissement illimité\n• Outils utiles pour l'organisation de la communauté\n• Support technique disponible 24h/24 et 7j/7\n\nExplorez mes commandes et plongez dans un monde de possibilités infinies.\nEnsemble, nous construirons une communauté fantastique remplie de magnifiques souvenirs !\n\nMerci de m'avoir choisi, commençons cette incroyable aventure ! 🌟"
new_guild_owner_dm_title: "Bienvenue dans la famille iHorizon !"
new_guild_owner_dm_description: "# Merci d'avoir ajouté iHorizon sur votre serveur !\n\n> *Attendez... C'est tout ? Non, absolument pas.*\n\niHorizon est un bot Discord, ok ? Mais pas que. C'est aussi une communauté, un lore, un projet construit depuis plus de 6 ans (2020).\nUtiliser iHorizon, ce n'est pas seulement avoir un bot Discord complet, éternellement **gratuit** et **open source**. C'est aussi adhérer à un **concept**.\n\n> **Un bot Discord gratuit peut mieux faire le travail que des bots payants.**\n*Oui, c'est ça iHorizon : un bot complet, maintenu depuis 6 ans par des gens passionnés.*\n\nAlors oui... après ce message, merci.\nNous sommes légion. #ihorizon"
