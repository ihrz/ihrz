<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Meme Generator</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Impact&display=swap');

		body {
			margin: 0;
			padding: 0;
			background: #000;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}

		.meme-container {
			position: relative;
			display: inline-block;
		}

		.meme-container img {
			width: 512px;
			height: auto;
			display: block;
		}

		.meme-text {
			position: absolute;
			width: 100%;
			text-align: center;
			font-family: 'Impact', sans-serif;
			color: white;
			font-size: 40px;
			letter-spacing: 1px;
			text-transform: uppercase;
			text-shadow: 2px 2px 0 #000, -2px 2px 0 #000,
				2px -2px 0 #000, -2px -2px 0 #000;
			padding: 0 10px;
		}

		.top-text {
			top: 10px;
		}
	</style>
</head>

<body>
	<div class="meme-container">
		<img src="{X}" alt="Meme Image">
		<div class="meme-text top-text">{Z}</div>
	</div>
</body>

</html>
