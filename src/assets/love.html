<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Love Command</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			background: #1e1e1e;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
		}

		.love-container {
			display: flex;
			gap: 20px;
			background: transparent;
			width: fit-content;
			align-items: center;
		}

		.love-container img {
			width: 400px;
			height: 400px;
			object-fit: cover;
			display: block;
		}
	</style>
</head>

<body>
	<div class="love-container">
		<img src="{X}" alt="User A">
		<img src="{Y}" alt="Love">
		<img src="{Z}" alt="User B">
	</div>
</body>

</html>
