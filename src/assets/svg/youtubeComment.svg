			<path fill="#aaaaaa" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
		</symbol>
	</defs>
	<rect width="744" height="{height}" rx="12" fill="#0f0f0f"/>
	{avatar}
	{header}
	{comment}
	<use href="#thumb" x="72" y="{actions_icon_y}" width="16" height="16"/>
	{likes}
	<use href="#thumb" x="{dislike_x}" y="{actions_icon_y}" width="16" height="16" transform="rotate(180 {dislike_center_x} {actions_center_y})"/>
