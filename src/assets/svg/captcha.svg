	<g fill="none" stroke="#1c130a" stroke-linecap="round">{noise_back}</g>
	<g font-family="Rye" font-size="38" fill="#1c130a">{code}</g>
	<g fill="none" stroke="#1c130a" stroke-linecap="round">{noise_front}</g>
</svg>
