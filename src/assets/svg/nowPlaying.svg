<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
	<defs>
		<clipPath id="card">
			<rect width="640" height="200" rx="20"/>
		</clipPath>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="{color_start}"/>
			<stop offset="1" stop-color="{color_end}"/>
		</linearGradient>
		<linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#000000" stop-opacity="0.35"/>
			<stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
		</linearGradient>
		<filter id="blur" x="-10%" y="-10%" width="120%" height="120%">
			<feGaussianBlur stdDeviation="28"/>
		</filter>
		<filter id="cover-shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
		</filter>
		<filter id="text-shadow" x="-5%" y="-30%" width="110%" height="160%">
			<feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
		</filter>
	</defs>
	<g clip-path="url(#card)">
		<rect width="640" height="200" fill="url(#background)"/>
		<g filter="url(#blur)" opacity="0.7">{backdrop}</g>
		<rect width="640" height="200" fill="url(#shade)"/>
	</g>
	<rect x="0.5" y="0.5" width="639" height="199" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
	<g filter="url(#cover-shadow)">
		<rect x="24" y="24" width="152" height="152" rx="14" fill="{color_start}"/>
		<rect x="24" y="24" width="152" height="152" rx="14" fill="#000000" opacity="0.25"/>
		<path transform="translate(18 0)" d="M112 70 v44.5 a14 14 0 1 1 -8 -12.6 V78 l-24 6 v38.5 a14 14 0 1 1 -8 -12.6 V78 Z" fill="#ffffff" opacity="0.55"/>
		{cover}
	</g>
	<g filter="url(#text-shadow)">{title}{artist}</g>
	{status}
	{progress}
	{current_time}
	{total_time}
</svg>
