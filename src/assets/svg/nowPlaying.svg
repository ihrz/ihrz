<svg xmlns="http://www.w3.org/2000/svg" width="400" height="{height}" viewBox="0 0 400 {height}">
	<defs>
		<linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
			<stop offset="0" stop-color="{color_start}"/>
			<stop offset="1" stop-color="{color_end}"/>
		</linearGradient>
		<filter id="cover-shadow" x="-10%" y="-10%" width="120%" height="130%">
			<feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
		</filter>
		<filter id="text-shadow" x="-5%" y="-30%" width="110%" height="160%">
			<feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
		</filter>
	</defs>
	<rect width="400" height="{height}" rx="20" fill="url(#background)"/>
	<rect width="400" height="{height}" rx="20" fill="#000000" opacity="0.18"/>
	<g filter="url(#cover-shadow)">{cover}</g>
	<g filter="url(#text-shadow)">{title}{artist}</g>
	<rect x="32" y="{progress_y}" width="336" height="5" rx="2.5" fill="#ffffff" opacity="0.25"/>
	<rect x="32" y="{progress_y}" width="{progress_width}" height="5" rx="2.5" fill="#4CAF50"/>
	{current_time}
	{total_time}
</svg>
