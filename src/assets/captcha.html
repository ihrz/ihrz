<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Captcha Texte Flouté</title>
	<style>
		body {
			background: #e0e0e0;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			font-family: monospace;
		}

		.captcha-container {
			background: #fff;
			border: 1px solid #000;
			padding: 20px 40px;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		.captcha-code {
			font-size: 36px;
			letter-spacing: 8px;
			color: #000000;
			filter: blur(1px) grayscale(100%);
			user-select: none;
			text-shadow: 0 0 2px #aaa;
		}
	</style>
</head>

<body>
	<div class="captcha-container">
		<div class="captcha-code">{X}</div>
	</div>
</body>

</html>
