<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Meme Generator</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Impact&display=swap');

		body {
			margin: 0;
			padding: 0;
			background: #000;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
		}

		.meme-container {
			display: inline-block;
		}

		.caption-text {
			background: white;
			color: black;
			font-family: 'Impact', sans-serif;
			font-size: 40px;
			letter-spacing: 1px;
			text-transform: uppercase;
			text-align: center;
			padding: 20px;
			margin: 0;
			width: 512px;
			box-sizing: border-box;
		}

		.meme-container img {
			width: 512px;
			height: auto;
			display: block;
		}
	</style>
</head>

<body>
	<div class="meme-container">
		<div class="caption-text">{Z}</div>
		<img src="{X}" alt="Meme Image">
	</div>
</body>

</html>
