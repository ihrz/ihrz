<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		:root {
			--primary: #5865F2;
			--primary-glow: rgba(88, 101, 242, 0.3);
			--success: #3BA55C;
			--warning: #FAA61A;
			--danger: #ED4245;
			--bg-dark: #0B0C0F;
			--bg-medium: #1A1C23;
			--bg-light: #23252E;
			--text-bright: #FFFFFF;
			--text-muted: #8B8E98;
			--border: rgba(255, 255, 255, 0.06);
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
			background: linear-gradient(135deg, var(--bg-dark) 0%, #151820 100%);
			color: var(--text-bright);
			width: 1024px;
			height: 512px;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}

		.container {
			width: 100%;
			height: 100%;
			background: var(--bg-medium);
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
				0 0 0 1px var(--border);
			overflow: hidden;
			position: relative;
			display: flex;
			flex-direction: column;
		}

		.container::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 3px;
			background: linear-gradient(90deg, var(--primary), var(--success), var(--warning));
			box-shadow: 0 0 20px var(--primary-glow);
		}

		.header {
			padding: 20px 30px;
			background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-medium) 100%);
			border-bottom: 1px solid var(--border);
			position: relative;
		}

		.header::after {
			content: '';
			position: absolute;
			bottom: -1px;
			left: 30px;
			right: 30px;
			height: 1px;
			background: linear-gradient(90deg,
					transparent 0%,
					var(--primary) 50%,
					transparent 100%);
			opacity: 0.5;
		}

		.title {
			font-size: 22px;
			font-weight: 800;
			color: var(--text-bright);
			margin-bottom: 4px;
			letter-spacing: -0.5px;
		}

		.subtitle {
			font-size: 13px;
			color: var(--text-muted);
			font-weight: 500;
		}

		.stats-row {
			display: flex;
			gap: 15px;
			padding: 20px 30px;
			background: var(--bg-medium);
			border-bottom: 1px solid var(--border);
		}

		.stat-card {
			flex: 1;
			background: var(--bg-light);
			border-radius: 12px;
			padding: 16px;
			border: 1px solid var(--border);
			position: relative;
			overflow: hidden;
		}

		.stat-card::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 4px;
			height: 100%;
			background: var(--primary);
		}

		.stat-card:nth-child(1)::before {
			background: var(--success);
		}

		.stat-card:nth-child(2)::before {
			background: var(--primary);
		}

		.stat-card:nth-child(3)::before {
			background: var(--warning);
		}

		.stat-card:nth-child(4)::before {
			background: var(--danger);
		}

		.stat-label {
			font-size: 11px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			color: var(--text-muted);
			margin-bottom: 6px;
		}

		.stat-value {
			font-size: 28px;
			font-weight: 800;
			color: var(--text-bright);
			line-height: 1;
		}

		.stat-unit {
			font-size: 14px;
			font-weight: 600;
			color: var(--text-muted);
			margin-left: 3px;
		}

		.chart-wrapper {
			flex: 1;
			padding: 20px 30px 30px;
			background: var(--bg-medium);
			display: flex;
			flex-direction: column;
		}

		.chart-container {
			flex: 1;
			background: var(--bg-light);
			border-radius: 16px;
			padding: 20px;
			border: 1px solid var(--border);
			box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
			position: relative;
		}

		.chart-container::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: radial-gradient(circle at 50% 0%,
					rgba(88, 101, 242, 0.05) 0%,
					transparent 50%);
			pointer-events: none;
		}

		svg {
			position: relative;
			z-index: 1;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="header">
			<div class="title">WebSocket Ping - {bot_name}</div>
			<div class="subtitle">History of the last hour</div>
		</div>

		<div class="stats-row">
			<div class="stat-card">
				<div class="stat-label">Actual</div>
				<div>
					<span class="stat-value">{current_ping}</span>
					<span class="stat-unit">ms</span>
				</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">Average</div>
				<div>
					<span class="stat-value">{avg_ping}</span>
					<span class="stat-unit">ms</span>
				</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">Minimum</div>
				<div>
					<span class="stat-value">{min_ping}</span>
					<span class="stat-unit">ms</span>
				</div>
			</div>
			<div class="stat-card">
				<div class="stat-label">Maximum</div>
				<div>
					<span class="stat-value">{max_ping}</span>
					<span class="stat-unit">ms</span>
				</div>
			</div>
		</div>

		<div class="chart-wrapper">
			<div class="chart-container">
				{chart_svg}
			</div>
		</div>
	</div>
</body>

</html>
