# ihrz Rust migration orchestrator — local configuration.
# Copy nothing secret here: Hermes credentials stay in ~/.hermes/.
# This file is sourced by migrate-loop.sh and migrate.sh.

# Absolute repo root (autodetected if empty).
MIGRATION_REPO_ROOT="/home/kisakay/Documents/Code/GitLab/ihrz"
# Branch the orchestrator works on. Never switches branches by itself.
MIGRATION_BRANCH="rust-recode"

# Discord delivery target for notifications (see `hermes send --list`).
MIGRATION_DISCORD_TARGET="discord:#hermes"

# Worker invocation: opencode agent configured in opencode.json.
# The rust-migrator agent embeds .opencode/rust-migrator.md (mandatory).
MIGRATION_AGENT="rust-migrator"
# Model override (empty = agent default).
# Pinned 2026-10-08: the stored Anthropic key is rejected
# ("invalid x-api-key" for claude-haiku-5-5); Meta works (this setup's
# proven provider). Re-test Anthropic manually before unpinning.
MIGRATION_MODEL="meta/muse-spark-1.3-contributor"

# Retries per single migration unit before parking it as blocked.
MIGRATION_MAX_RETRIES="5"
# Base backoff between retries (seconds, exponential: base * 2^attempt).
MIGRATION_BACKOFF_BASE="60"
# Max seconds for one worker run before it is killed and retried.
MIGRATION_WORKER_TIMEOUT="3600"
# Idle sleep between successful iterations (seconds).
MIGRATION_IDLE_SLEEP="30"

# Validation commands (run from rust/).
MIGRATION_CHECK_FMT="cargo fmt --all -- --check"
MIGRATION_CHECK_BUILD="cargo check --workspace"
MIGRATION_CHECK_TEST="cargo test --workspace"
