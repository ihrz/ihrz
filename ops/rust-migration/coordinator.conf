# ihrz Rust migration — parallel coordinator configuration.
# Sourced by coordinator.sh, worker.sh, integrate.sh, inventory.sh, coord.sh.
# Secrets never live here (Hermes creds stay in ~/.hermes/).
#
# Every variable below is a DEFAULT: an already-exported environment value
# always wins (the `: "${VAR:=default}"` idiom). This lets tests redirect
# MIGRATION_REPO_ROOT/MIGRATION_BRANCH at fixtures and lets operators
# override without editing the file.

# Absolute repo root (autodetected if empty).
: "${MIGRATION_REPO_ROOT:=/home/kisakay/Documents/Code/GitLab/ihrz}"
# Base branch workers branch off and integrate back into.
: "${MIGRATION_BRANCH:=rust-recode}"

# Discord delivery target for notifications (see `hermes send --list`).
: "${MIGRATION_DISCORD_TARGET:=discord:#hermes}"

# Worker invocation: opencode agent configured in opencode.json.
: "${MIGRATION_AGENT:=rust-migrator}"
: "${MIGRATION_REVIEW_AGENT:=rust-reviewer}"
: "${MIGRATION_TEST_AGENT:=rust-tester}"
# Model override (empty = agent default). Pinned: stored Anthropic key was
# rejected ("invalid x-api-key"); meta provider is this setup's proven one.
: "${MIGRATION_MODEL:=meta/muse-spark-1.3-contributor}"

# Parallelism: max concurrent implementation workers.
# Validated against this host (16 cores, 31 GB RAM): one `cargo check
# --workspace` uses ~2-4 GB + ~3-4 cores, so 3 workers keep headroom for the
# integrator + desktop. Override cautiously; the coordinator caps workers at
# min(MAX_WORKERS, nproc/2, mem_gb/6) and logs the effective value.
: "${MIGRATION_MAX_WORKERS:=3}"

# Per-task worker timeout (seconds) before SIGTERM/SIGKILL + requeue.
: "${MIGRATION_WORKER_TIMEOUT:=3600}"
# Retries per task before it is marked failed (then parked for triage).
: "${MIGRATION_MAX_RETRIES:=2}"
# Backoff between coordinator dispatch ticks (seconds).
: "${MIGRATION_TICK_SEC:=30}"
# Heartbeat freshness: running tasks silent longer than this are stale.
: "${MIGRATION_STALE_SEC:=900}"
# Idle sleep when the queue is empty but inventory found nothing (seconds).
# NOTE: an empty queue ALWAYS triggers an inventory scan first; this sleep
# only applies when the scan also finds zero verified gaps.
: "${MIGRATION_IDLE_SLEEP:=600}"

# Validation commands (run from rust/ inside each worktree + main tree).
: "${MIGRATION_CHECK_FMT:=cargo fmt --all -- --check}"
: "${MIGRATION_CHECK_BUILD:=cargo check --workspace}"
: "${MIGRATION_CHECK_TEST:=cargo test --workspace}"
